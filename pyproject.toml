[project]
name = "pykrait"
version = "0.4.0"
description = "Python Calcium Recording Analysis and Interpretation Toolbox"
readme = { file = "README.md", content-type = "text/markdown" }
license = { text = "MIT" }
authors = [
    { name = "phaleanopsis", email = "22663502+phaleanopsis@users.noreply.github.com" }
]
requires-python = ">=3.11"
# bioio plugins and cellpose change their APIs between major versions (bioio-czi 4 removed
# use_aicspylibczi), so they are capped at the next untested major version
dependencies = [
    "aicspylibczi>=3.3.1",
    "bioio>=3.2.0,<4",
    "bioio-czi>=2.4.0,<5",
    "bioio-ome-tiff>=1.1.0,<2",
    "bioio-tifffile>=1.3.0,<2",
    "bioio-imageio<2",
    "cellpose>=4.0.8,<5",
    "dask>=2025.5.1",
    "fsspec>=2022.8.0",
    "imagecodecs>=2025.3.30",
    "matplotlib>=3.10.3",
    # zarr 2 imports numcodecs.blosc.cbuffer_sizes, which numcodecs 0.16 removed
    "numcodecs>=0.15,<0.16",
    "numpy>2",
    "opencv-python-headless>=4.10.0.84",
    "pyyaml>=6.0.2",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "tifffile>=2025.5.10",
    "tqdm>=4.66",
    "xarray>=2025.12",
    "pandas>=2.3.1",
    "psutil>=6.0",
    # reads CZI files much faster than bioio; there is no wheel for Intel Macs, which
    # fall back to bioio
    "pylibCZIrw>=6.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "zstandard>=0.23.0",
    "zarr>=2.15.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
[project.optional-dependencies]
gui = [
    "pyside6>=6.9.1",
]
dev = [
    "build>=1.2.2.post1",
    "hatch>=1.14.1",
    "ipywidgets>=8.1.7",
    "pydata-sphinx-theme>=0.16.1",
    "ruff>=0.11.13",
    "sphinx>=8.1.3",
    "sphinx-autoapi>=3.6.0",
    "sphinx-favicon>=1.0.1",
    "tomli>=2.2.1",
    "twine>=6.1.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.0",
    "myst-parser>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = ["src"]
packages = ["src/pykrait"]

[tool.hatch.build.targets.sdist]
include = ["src/**", "README.md", "pyproject.toml"]

[tool.hatch.envs.tests]
dependencies = [
  "pytest",
  "pytest-cov",
]

[tool.hatch.envs.coverage]
dependencies = [
  "coverage[toml]",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["pykrait"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py311"
